<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Calulator</title>
  <style>
    *{
   margin: 0;
   padding: 0;
   box-sizing: border-box;
   background-color: #0a56e5;
   font-family: sans-serif;
   outline: none;
}
.container{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.calculator{
    background-color: #08dcf4;
    padding: 10px;
    border-radius: 30px;
    box-shadow: inset 5px 5px 12px #fff,
                    5px 5px 12px rgb(0,0, 0, 16);
    display: grid;
    grid-template-columns: repeat(4,60px);
    
}



input{
    grid-column: span 4;
    height: 70px;
    width: 240px;
    background-color: #09d6ed;
    box-shadow:  inset -5px -5px 12px #fff, 
                 inset 5px 5px 12px rgb(0,0,0,.16);
    border: none;
    border-radius: 30px;
    color: 70,70,70;
    font-size: 30px;
    text-align: end;
    margin: auto;
    margin-top: 20px;
    margin-bottom: 20px;
    padding: 20px;
    transition: 1ms;     
}
button{
    height: 48px;
    width: 48px;
    background-color:  #0dd5eb;
    box-shadow: -5px -5px 12px #fff,
                 5px 5px 12px rgb(0,0,0,16);
    border: none;
    border-radius: 50%;
    margin: 8px;
    font-size: 16px; 
   
}


  </style>
<body>
  <div class="container">
    <div class="calculator">
      <input type="text" placeholder="0" id="output-screen">
      <button onclick="Clear()">AC</button>
      <button onclick="del()">CE</button>
      <button onclick="display('%')">%</button>
      <button onclick="display('/')">/</button>
      <button onclick="display('7')">7</button>
      <button onclick="display('8')">8</button>
      <button onclick="display('9')">9</button>
      <button onclick="display('*')">*</button>
      <button onclick="display('4')">4</button>
      <button onclick="display('5')">5</button>
      <button onclick="display('6')">6</button>
      <button onclick="display('-')">-</button>
      <button onclick="display('1')">1</button>
      <button onclick="display('2')">2</button>
      <button onclick="display('3')">3</button>
      <button onclick="display('+')">+</button>
      <button onclick="display('.')">.</button>
      <button onclick="display('0')">0</button>
      <button onclick="display('00')">00</button>
      <button onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    
    let outputScreen = document.getElementById("output-screen");

    function display(num){
      outputScreen.value += num;
    }
    function calculate(){
      try{
        outputScreen.value = eval(outputScreen.value);
      }
      catch(err)
      {
        alert("Invalid")
      }
    }
    function del(){
      outputScreen.value = outputScreen.value.slice(0,-1);
    }
    function Clear(){
      outputScreen.value = "";
    }

  </script>
</body>
</html>
